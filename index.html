<!DOCTYPE html>
<html lang="en">
<head>

    <title>Tabelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <caption>Listagem de produtos</caption>

                <th>Produto</th>

                <td>6000€</td>
            </tr>
            <tr>
                <td>hamburguer</td>

                <td>700€</td>
            </tr>
            <tr>
                <td>GTA VI</td>
                <td>1</td>

            </tr>
            <tfoot>
                <tr>
                    <td colspan="2">Total</td>
                    <td>6795€ </td>
                </tr>
            </tfoot>
        </tbody>
    </table>
</body>
</html>
